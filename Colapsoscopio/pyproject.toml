[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "colapsoscopio"
version = "0.1.0"
description = "Visualizador de la evolución temporal de funciones de onda (TDSE 1D)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["colapsoscopio*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
