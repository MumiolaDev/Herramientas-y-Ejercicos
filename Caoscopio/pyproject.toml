[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "caoscopio"
version = "0.1.0"
description = "Visualizador de sistemas dinámicos caóticos y no caóticos (retratos de fase, sensibilidad a condiciones iniciales)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["caoscopio*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
